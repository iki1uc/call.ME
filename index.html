<style>
  *{margin:0;padding:0;box-sizing:border-box}

            font-family:'Consolas','Courier New',monospace;overflow:hidden}

  #kopf h1{font-size:clamp(20px,4vw,36px);font-weight:100;letter-spacing:.45em;
           color:#8cf0d0;text-shadow:0 0 40px rgba(140,240,208,.2)}
  #kopf .unter{font-size:10px;letter-spacing:.4em;color:#3a5a4a;margin-top:10px}

  #werte{position:fixed;top:50%;left:24px;transform:translateY(-50%);
         z-index:6;pointer-events:none;font-size:10px;letter-spacing:.25em;
         line-height:2.4;color:#3a5a4a}
  #werte .z{display:grid;grid-template-columns:50px 80px 50px;gap:8px;
            align-items:center}
  #werte .k{color:#3a5a4a}
  #werte .v{color:#8cf0d0;text-align:right;font-weight:bold}
  #werte .b{height:3px;background:#0a1c24;position:relative;overflow:hidden}
  #werte .b i{display:block;height:100%;background:#8cf0d0;transition:width .3s}

  #frieden{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
           text-align:center;z-index:6;pointer-events:none;
           font-size:11px;letter-spacing:.5em;
           transition:color .8s, text-shadow .8s}
  #frieden.an{color:#8cf0d0;text-shadow:0 0 30px rgba(140,240,208,.5)}
  #frieden.aus{color:#3a5a4a}

  #satz{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
        font-size:9px;letter-spacing:.35em;color:#2a4a3a;
        z-index:6;pointer-events:none;text-align:center;line-height:2.2}

  #fuss{position:fixed;bottom:14px;right:20px;font-size:9px;
        letter-spacing:.35em;color:#1e3328;z-index:6}
  #fuss b{color:#3a5a4a;font-weight:400}

  .ecke{position:fixed;width:14px;height:14px;z-index:998;
        pointer-events:none;opacity:.28;border-color:#8cf0d0}
  .ecke.ol{top:12px;left:12px;border-top:1px solid;border-left:1px solid}
  .ecke.or{top:12px;right:12px;border-top:1px solid;border-right:1px solid}
  .ecke.ul{bottom:12px;left:12px;border-bottom:1px solid;border-left:1px solid}
  .ecke.ur{bottom:12px;right:12px;border-bottom:1px solid;border-right:1px solid}

  #sperre{display:none}
  html[data-gate="gesperrt"] body > *:not(#sperre){display:none !important}
  html[data-gate="gesperrt"] #sperre{
    display:flex;position:fixed;inset:0;
    align-items:center;justify-content:center;flex-direction:column;
    background:#04070c;z-index:9999;text-align:center;padding:24px}
  #sperre .wort{font-size:clamp(22px,5vw,44px);font-weight:100;
                letter-spacing:.45em;color:#8cf0d0;margin-bottom:16px}
  #sperre .grund{font-size:10px;letter-spacing:.35em;color:#b388ff}

<body>

  window.__EVO_GATE = { ok:false, grund:'wird geprüft', zeit:Date.now() };

<!-- 3 · TÜRSTEHER -->
<script>
  (function(){
    if(window.__EVO_WACHE === true){
      window.__EVO_GATE.ok = true;
      window.__EVO_GATE.grund = 'wächter aktiv';
    } else {
      window.__EVO_GATE.grund = 'security.js fehlt';
      document.documentElement.setAttribute('data-gate','gesperrt');
      document.addEventListener('DOMContentLoaded', () => {
        const g = document.getElementById('sperre-grund');
        if(g) g.textContent = window.__EVO_GATE.grund;
      });
    }
  })();
</script>

<canvas id="cv"></canvas>

<div id="kopf">
  <div class="marke">iki1uc · kader</div>
  <h1>ATOM</h1>
  <div class="unter">natur · wasser · co₂ · sauerstoff</div>
</div>

<div id="werte">
  <div class="z"><span class="k">O₂</span><span class="b"><i id="bO2"></i></span><span class="v" id="vO2">—</span></div>
  <div class="z"><span class="k">CO₂</span><span class="b"><i id="bCO2"></i></span><span class="v" id="vCO2">—</span></div>
  <div class="z"><span class="k">H₂O</span><span class="b"><i id="bH2O"></i></span><span class="v" id="vH2O">—</span></div>

</div>

<div id="satz">
  o₂ und co₂ sind gegenpole<br>
  atem bewegt sie · frieden ist das band
</div>

  <div class="wort">GESPERRT</div>
  <div class="grund" id="sperre-grund">wächter nicht geladen</div>
</div>

<div class="ecke or"></div>
<div class="ecke ul"></div>
<div class="ecke ur"></div>

<script type="module">
import { ATOM } from './atom.js';

if(!window.__EVO_GATE || !window.__EVO_GATE.ok){
  console.log('atom · gesperrt');
  throw new Error('gate');
}

function setZeit(){
  const j = new Date();
  document.getElementById('zeit').textContent =
    String(j.getHours()).padStart(2,'0') + ':' +
    String(j.getMinutes()).padStart(2,'0');
}
setZeit();
setInterval(setZeit, 30000);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cx, cy;

function resize(){
  const dpr = Math.min(devicePixelRatio, 2);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = innerWidth / 2;
  cy = innerHeight / 2;
}
addEventListener('resize', resize);
resize();

const FARBEN = {
  o2:   '#7ce0a8',
  co2:  '#ffcc44',
  h2o:  '#5fc8ff',
  kern: '#b388ff',
};

let t = 0;
function zeichne(){
  if(!window.__EVO_GATE.ok) return;
  requestAnimationFrame(zeichne);
  t += 16;

  const z = ATOM.atme(t);

  ctx.fillStyle = 'rgba(4,7,12,0.22)';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  const Rmax = Math.min(innerWidth, innerHeight) * 0.32;
  const Rinner = Rmax * (1 - ATOM.band / ATOM.mitte);

  ctx.beginPath();
  ctx.arc(cx, cy, Rmax, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(140,240,208,0.06)';
  ctx.lineWidth = 0.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, Rinner, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(140,240,208,0.06)';
  ctx.lineWidth = 0.6;
  ctx.stroke();

  const ringe = [
    { k:'o2',   wert:z.o2,   farbe:FARBEN.o2   },
    { k:'co2',  wert:z.co2,  farbe:FARBEN.co2  },
    { k:'h2o',  wert:z.h2o,  farbe:FARBEN.h2o  },
    { k:'kern', wert:z.kern, farbe:FARBEN.kern },
  ];

  ringe.forEach((r, i) => {
    const a0 = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const a1 = a0 + (Math.PI * 2) / 4 * r.wert;

    ctx.beginPath();
    ctx.arc(cx, cy, Rmax, a0, a1);
    ctx.strokeStyle = r.farbe;
    ctx.globalAlpha = 0.35 + r.wert * 0.5;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    const ex = cx + Math.cos(a1) * Rmax;
    const ey = cy + Math.sin(a1) * Rmax;
    ctx.beginPath();
    ctx.arc(ex, ey, 2.5 + r.wert * 2, 0, Math.PI * 2);
    ctx.fillStyle = r.farbe;
    ctx.globalAlpha = 0.7 + r.wert * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  const kernGlut = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
  const hauch = z.frieden ? 0.5 : 0.2;
  kernGlut.addColorStop(0, `rgba(140,240,208,${hauch})`);
  kernGlut.addColorStop(0.5, `rgba(179,136,255,${hauch * 0.5})`);
  kernGlut.addColorStop(1, 'rgba(140,240,208,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 70, 0, Math.PI * 2);
  ctx.fillStyle = kernGlut;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 3 + z.kern * 3, 0, Math.PI * 2);
  ctx.fillStyle = '#8cf0d0';
  ctx.fill();

  for(let i = 0; i < 4; i++){
    const ph = ((t * 0.00015) + i / 4) % 1;
    const r = Rmax * (1 - ph);
    if(r < 10) continue;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(140,240,208,${0.06 * (1 - ph)})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  const setz = (id, x) => {
    const v = document.getElementById('v' + id);
    const b = document.getElementById('b' + id);
    if(v) v.textContent = (x * 100).toFixed(0) + '%';
    if(b) b.style.width  = (x * 100).toFixed(0) + '%';
  };
  setz('O2',   z.o2);
  setz('CO2',  z.co2);
  setz('H2O',  z.h2o);
  setz('Kern', z.kern);

  const fEl = document.getElementById('frieden');
  if(z.frieden){
    fEl.classList.add('an'); fEl.classList.remove('aus');
    fEl.textContent = '· frieden ·';
  } else {
    fEl.classList.add('aus'); fEl.classList.remove('an');
    const w = z.waage;
    const max = Math.max(w.o2, w.co2, w.h2o, w.kern);
    const wer = max === w.o2 ? 'o₂' :
                max === w.co2 ? 'co₂' :
                max === w.h2o ? 'h₂o' : 'kern';
    fEl.textContent = `· ${wer} außer band ·`;
  }
}
zeichne();
</script>
